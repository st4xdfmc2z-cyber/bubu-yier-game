<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd6e4">
<title>布布一二消消乐</title>
<style>
:root{--pink:#ff7aa8;--pink2:#ffb3cc;--cream:#fff7f9;--brown:#5a3a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--brown);
background:radial-gradient(circle at 20% 10%,#fff0f6 0,transparent 40%),radial-gradient(circle at 85% 90%,#ffe3ee 0,transparent 45%),linear-gradient(180deg,#ffe0ec,#ffd1e1 60%,#ffc6da)}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ibtn{width:42px;height:42px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 #f3a9c2;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brown)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f3a9c2}
#lvl{font-weight:900;font-size:20px;background:#fff;padding:6px 18px;border-radius:999px;box-shadow:0 3px 0 #f3a9c2;color:var(--pink)}
.stats{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:rgba(255,255,255,.85);border-radius:16px;padding:5px 4px;text-align:center;box-shadow:0 3px 0 #f6b5cb}
.pill small{display:block;font-size:12px;color:#b07a8a}
.pill b{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
#movesPill.low b{color:#ff4d7d;animation:throb .6s infinite alternate}
@keyframes throb{to{transform:scale(1.15)}}
.bar{position:relative;margin:10px 4px 2px;height:14px;background:#fff;border-radius:99px;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
#barFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb3cc,#ff7aa8);transition:width .35s}
.bar .st{position:absolute;top:-7px;font-size:18px;transform:translateX(-50%);color:#ddd;text-shadow:0 1px 0 #fff;transition:color .3s}
.bar .st.on{color:#ffc43d}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{position:relative;border-radius:18px;padding:0;background:#fff7fa;box-shadow:0 6px 0 #f3a0bd,0 10px 24px rgba(255,105,150,.25);touch-action:none}
#grid{position:absolute;inset:6px;background-image:linear-gradient(45deg,#ffeef4 25%,transparent 25%,transparent 75%,#ffeef4 75%),linear-gradient(45deg,#ffeef4 25%,transparent 25%,transparent 75%,#ffeef4 75%);background-size:25% 25%;background-position:0 0,12.5% 12.5%;border-radius:12px;overflow:hidden}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition-property:transform;transition-timing-function:ease-out;will-change:transform;pointer-events:none}
.tile.fall{transition-timing-function:cubic-bezier(.45,.05,.75,1.1)}
.face{position:absolute;inset:3%;border-radius:22%;background-size:cover;background-position:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 2px rgba(0,0,0,.12);transition:transform .15s}
.sel .face{transform:scale(1.13);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink),0 4px 8px rgba(0,0,0,.2)}
.hint .face{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{0%{transform:rotate(-9deg) scale(1.05)}100%{transform:rotate(9deg) scale(1.05)}}
.pop .face{animation:pop .26s ease-in forwards}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3);filter:brightness(1.4)}100%{transform:scale(0);opacity:0}}
.born .face{animation:born .35s ease-out}
@keyframes born{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

.ctext{display:inline-block;font-size:min(44px,10vw);font-weight:900;color:#fff;-webkit-text-stroke:2px #ff5d93;text-shadow:0 4px 0 #ff5d93,0 6px 12px rgba(255,80,140,.5);animation:ctext 1s ease-out forwards;white-space:nowrap}
@keyframes ctext{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.2) rotate(3deg);opacity:1}35%{transform:scale(1)}80%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(-50px)}}
.ptext{position:absolute;font-weight:900;color:#ff4d7d;font-size:18px;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff;animation:ptext .8s ease-out forwards;z-index:4;transform:translate(-50%,-50%)}
@keyframes ptext{to{margin-top:-40px;opacity:0}}
#tip{text-align:center;font-size:12px;color:#c0708a;margin-top:4px;min-height:16px}
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;
background:radial-gradient(circle at 50% 30%,#fff5f9,#ffd6e5 70%)}
.hidden{display:none!important}
#start h1{margin:0 0 6px;font-size:42px;font-weight:900;color:#fff;letter-spacing:2px;-webkit-text-stroke:2px #ff5d93;text-shadow:0 5px 0 #ff5d93,0 8px 16px rgba(255,80,140,.35);animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#start .sub{color:#d06c8f;font-size:15px;margin-bottom:10px}
#start img{width:min(92%,400px);border-radius:24px;box-shadow:0 8px 24px rgba(255,105,150,.25);border:4px solid #fff}
.btn{margin-top:14px;min-width:200px;padding:14px 26px;border:none;border-radius:999px;font-size:20px;font-weight:900;color:#fff;cursor:pointer;
background:linear-gradient(180deg,#ff9cbf,#ff6a9e);box-shadow:0 5px 0 #e04f83,0 8px 16px rgba(255,80,140,.3);font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e04f83}
.btn.ghost{background:#fff;color:#ff6a9e;box-shadow:0 5px 0 #f3a9c2;font-size:17px;padding:11px 22px}
.info{margin-top:12px;font-size:14px;color:#b06c84;line-height:1.7}
.tiles{display:flex;gap:6px;justify-content:center;margin-top:8px}
.tiles div{width:36px;height:36px;border-radius:9px;background-size:cover}
#mask{position:absolute;inset:0;z-index:30;background:rgba(255,190,214,.55);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.card{width:min(100%,340px);background:#fff;border-radius:28px;padding:18px 18px 22px;text-align:center;box-shadow:0 10px 30px rgba(255,90,140,.35);animation:cardin .4s cubic-bezier(.2,1.4,.5,1)}
@keyframes cardin{from{transform:scale(.5);opacity:0}}
.card img{width:70%;max-width:220px}
.card h2{margin:4px 0;font-size:30px;color:#ff5d93;font-weight:900}
.card p{margin:4px 0;color:#a06a7c}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0}
.stars span{color:#eee;display:inline-block}
.stars span.on{color:#ffc43d;text-shadow:0 3px 0 #e8a514;animation:staron .5s cubic-bezier(.2,1.6,.5,1) backwards}
@keyframes staron{from{transform:scale(0) rotate(-90deg)}}
.card .btn{min-width:0;width:100%}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:6;background:rgba(255,255,255,.95);color:#ff5d93;font-weight:900;padding:12px 20px;border-radius:20px;box-shadow:0 6px 16px rgba(255,90,140,.3);white-space:nowrap;font-size:18px;animation:cardin .3s}
</style>
</head>
<body>
<div id="app">
  <div class="row">
    <button class="ibtn" id="homeBtn" aria-label="首页">🏠</button>
    <div id="lvl">第 1 关</div>
    <button class="ibtn" id="muteBtn" aria-label="声音">🔊</button>
  </div>
  <div class="stats">
    <div class="pill"><small>分数</small><b id="score">0</b></div>
    <div class="pill"><small>目标</small><b id="target">0</b></div>
    <div class="pill" id="movesPill"><small>步数</small><b id="moves">0</b></div>
  </div>
  <div class="bar"><div id="barFill"></div><span class="st" id="st1">★</span><span class="st" id="st2">★</span><span class="st" id="st3">★</span></div>
  <div id="wrap"><div id="board"><div id="grid"></div><div id="combo"></div></div></div>
  <div id="tip">滑动或点两下，交换相邻的小可爱～</div>

<script>
(()=>{
'use strict';
const N=8,T=6,BOMB=6;
const $=id=>document.getElementById(id);
const gridEl=$('grid'),boardEl=$('board'),wrapEl=$('wrap'),comboEl=$('combo');
const WORDS=['赞！','好甜！','太爱了！','甜甜蜜蜜！','爱你一万年！','布布一二天下第一！'];
const STORE='bubu_yier_xxl_v1';
let save={best:0,maxLevel:1,stars:{}};
try{Object.assign(save,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}}
let grid=[],busy=false,sel=null,score=0,moves=0,target=0,level=1,combo=0,idleTimer=null,hintTiles=[],playing=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const targetFor=L=>500+(L-1)*300;
const movesFor=L=>Math.max(16,22-Math.floor((L-1)/2));
const starFor=(s,t)=>s>=t*1.8?3:s>=t*1.35?2:s>=t?1:0;

/* ---------- audio ---------- */
let ac=null,muted=localStorage.getItem(STORE+'_mute')==='1';
function ensureAC(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,d,type,vol,f2,delay){if(muted||!ac)return;const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
const sfx={
 swap(){tone(420,.09,'triangle',.12,640)},
 bad(){tone(240,.12,'square',.06,180);tone(200,.14,'square',.05,150,.1)},
 pop(c){const b=523*Math.pow(2,Math.min(c-1,8)*2/12);tone(b,.13,'sine',.25,b*1.7);tone(b*2,.08,'triangle',.06,null,.03)},
 special(){tone(300,.35,'sawtooth',.06,1200);tone(880,.3,'sine',.15,1760,.05)},
 sel(){tone(700,.05,'sine',.1)},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.18,null,i*.12))},
 lose(){[523,440,392,330].forEach((f,i)=>tone(f,.28,'sine',.15,null,i*.15))}
};
function setMute(m){muted=m;$('muteBtn').textContent=m?'🔇':'🔊';try{localStorage.setItem(STORE+'_mute',m?'1':'0')}catch(e){}}
setMute(muted);

/* ---------- layout ---------- */
function layout(){const r=wrapEl.getBoundingClientRect();const s=Math.max(200,Math.floor(Math.min(r.width-4,r.height-10)));boardEl.style.width=s+'px';boardEl.style.height=s+'px'}
window.addEventListener('resize',layout);

/* ---------- tiles ---------- */
function look(tile){tile.face.className='face ty'+tile.t+(tile.s&&tile.s!=='b'?' sp-'+tile.s:'')}
function mk(t,s,r,c){const el=document.createElement('div');el.className='tile';const f=document.createElement('div');el.appendChild(f);const tile={t,s:s||null,el,face:f};look(tile);place(tile,r,c,0);gridEl.appendChild(el);return tile}
function place(tile,r,c,dur){tile.el.style.transitionDuration=(dur||0)+'ms';tile.el.style.transform=`translate(${c*100}%,${r*100}%)`}
const at=(r,c)=>r>=0&&r<N&&c>=0&&c<N?grid[r][c]:null;
const ty=(r,c)=>{const x=at(r,c);return x?x.t:-1};

/* ---------- match logic ---------- */
function findRuns(){const runs=[];
 for(let r=0;r<N;r++){let c=0;while(c<N){const t=ty(r,c);let e=c+1;while(e<N&&ty(r,e)===t)e++;if(t>=0&&t<T&&e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push([r,k]);runs.push({dir:'h',cells})}c=e}}
 for(let c=0;c<N;c++){let r=0;while(r<N){const t=ty(r,c);let e=r+1;while(e<N&&ty(e,c)===t)e++;if(t>=0&&t<T&&e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push([k,c]);runs.push({dir:'v',cells})}r=e}}
 return runs}
function typesArr(){return grid.map(row=>row.map(x=>x?x.t:-1))}
function lineAt(a,r,c){const t=a[r][c];if(t<0||t>=T)return false;let h=1,k=c-1;while(k>=0&&a[r][k]===t){h++;k--}k=c+1;while(k<N&&a[r][k]===t){h++;k++}if(h>=3)return true;let v=1;k=r-1;while(k>=0&&a[k][c]===t){v++;k--}k=r+1;while(k<N&&a[k][c]===t){v++;k++}return v>=3}
function findMove(){const a=typesArr();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(a[r][c]===BOMB){const nb=c+1<N?[r,c+1]:[r,c-1];return[[r,c],nb]}
  for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;const x=a[r][c],y=a[r2][c2];if(x===y)continue;a[r][c]=y;a[r2][c2]=x;const ok=lineAt(a,r,c)||lineAt(a,r2,c2);a[r][c]=x;a[r2][c2]=y;if(ok)return[[r,c],[r2,c2]]}}
 return null}
function genTypes(){let a;for(let tries=0;tries<200;tries++){a=[];for(let r=0;r<N;r++){a.push([]);for(let c=0;c<N;c++){let t,g=0;do{t=rnd(T);g++}while(g<30&&((c>=2&&a[r][c-1]===t&&a[r][c-2]===t)||(r>=2&&a[r-1][c]===t&&a[r-2][c]===t)));a[r].push(t)}}
  grid=a.map(row=>row.map(t=>({t})));if(!findRuns().length&&findMove())return a}return a}

/* ---------- effects ---------- */
function showCombo(text){comboEl.innerHTML='';const s=document.createElement('span');s.className='ctext';s.textContent=text;comboEl.appendChild(s);setTimeout(()=>{if(s.parentNode)s.remove()},1000)}
function ptext(r,c,txt){const d=document.createElement('div');d.className='ptext';d.textContent=txt;d.style.left=((c+.5)*12.5)+'%';d.style.top=((r+.5)*12.5)+'%';gridEl.appendChild(d);setTimeout(()=>d.remove(),800)}
function beam(kind,idx){const b=document.createElement('div');b.className='beam';if(kind==='h'){Object.assign(b.style,{left:'0',width:'100%',top:(idx*12.5+4)+'%',height:'4.5%'})}else{Object.assign(b.style,{top:'0',height:'100%',left:(idx*12.5+4)+'%',width:'4.5%',background:'linear-gradient(180deg,transparent,#fff 30%,#fff 70%,transparent)'})}gridEl.appendChild(b);setTimeout(()=>b.remove(),360)}
function sparks(r,c){const ems=['💗','✨','💕'];for(let i=0;i<3;i++){const s=document.createElement('div');s.className='spark';s.textContent=ems[i];s.style.left=((c+.3)*12.5)+'%';s.style.top=((r+.3)*12.5)+'%';s.style.setProperty('--dx',(rnd(60)-30)+'px');s.style.setProperty('--dy',(-20-rnd(40))+'px');gridEl.appendChild(s);setTimeout(()=>s.remove(),600)}}
function toast(txt,ms){const d=document.createElement('div');d.className='toast';d.textContent=txt;boardEl.appendChild(d);setTimeout(()=>d.remove(),ms||1200)}

/* ---------- HUD ---------- */
function hud(){$('score').textContent=score;$('target').textContent=target;$('moves').textContent=moves;$('lvl').textContent='第 '+level+' 关';
 $('movesPill').classList.toggle('low',moves<=5&&playing);const max=target*1.8;$('barFill').style.width=Math.min(100,score/max*100)+'%';
 [[1,1],[2,1.35],[3,1.8]].forEach(([i,m])=>{const el=$('st'+i);el.style.left=Math.min(97,m/1.8*100)+'%';el.classList.toggle('on',score>=target*m)})}

/* ---------- clearing ---------- */
async function clearCells(set,creations){
 // expand specials
 const queue=[...set];const prot=new Set(creations.map(k=>k.r+','+k.c));const beams=[];let special=false;
 while(queue.length){const k=queue.shift();const [r,c]=k.split(',').map(Number);const x=at(r,c);if(!x||!x.s)continue;
  let add=[];
  if(x.s==='h'){for(let i=0;i<N;i++)add.push([r,i]);beams.push(['h',r])}
  else if(x.s==='v'){for(let i=0;i<N;i++)add.push([i,c]);beams.push(['v',c])}
  else if(x.s==='b'){const cnt=Array(T).fill(0);grid.forEach(row=>row.forEach(y=>{if(y&&y.t<T)cnt[y.t]++}));const best=cnt.indexOf(Math.max(...cnt));for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(ty(i,j)===best)add.push([i,j])}
  special=true;x.s=x.s+'_used';
  for(const [a,b] of add){const kk=a+','+b;if(!set.has(kk)&&!prot.has(kk)&&at(a,b)){set.add(kk);queue.push(kk)}}}
 if(special)sfx.special();
 beams.forEach(b=>beam(b[0],b[1]));
 let n=0,sr=0,sc=0;

function planRuns(runs,swapped){
 const set=new Set(),creations=[],used=new Set();
 const count={};runs.forEach(R=>R.cells.forEach(([r,c])=>{const k=r+','+c;count[k]=(count[k]||0)+1}));
 const sw=swapped?swapped.map(p=>p.join(',')):[];
 for(const R of runs){const keys=R.cells.map(p=>p.join(','));keys.forEach(k=>set.add(k));
  let kind=null;if(R.cells.length>=5)kind='b';else if(R.cells.length===4)kind=R.dir;else{const inter=keys.find(k=>count[k]>1&&!used.has(k));if(inter&&!keys.some(k=>used.has(k)))kind=R.dir==='h'?'v':'h'}
  if(!kind)continue;
  if(keys.some(k=>used.has(k))&&kind!=='b')continue;
  let pk=keys.find(k=>sw.includes(k)&&!used.has(k))||keys.find(k=>count[k]>1&&!used.has(k))||keys[Math.floor(keys.length/2)];
  const cand=[pk,...keys].filter(k=>!used.has(k));pk=cand.find(k=>{const [r,c]=k.split(',').map(Number);const x=at(r,c);return x&&!x.s})||null;
  if(!pk)continue;used.add(pk);const [r,c]=pk.split(',').map(Number);const t0=at(r,c).t;
  creations.push({r,c,t:kind==='b'?BOMB:t0,s:kind})}
 return {set,creations}}
async function collapse(){let maxd=0;
 for(let c=0;c<N;c++){let w=N-1;
  for(let r=N-1;r>=0;r--){const x=grid[r][c];if(x){if(r!==w){grid[w][c]=x;grid[r][c]=null;const d=90+55*(w-r);x.el.classList.add('fall');place(x,w,c,d);maxd=Math.max(maxd,d)}w--}}
  for(let i=0;w>=0;w--,i++){const x=mk(rnd(T),null,-1-i,c);grid[w][c]=x;void x.el.offsetWidth;x.el.classList.add('fall');const d=90+55*(w+1+i);place(x,w,c,d);maxd=Math.max(maxd,d)}}
 await sleep(maxd+40);
 grid.forEach(row=>row.forEach(x=>x&&x.el.classList.remove('fall')))}
async function cascade(swapped){
 for(let guard=0;guard<40;guard++){const runs=findRuns();if(!runs.length)break;combo++;
  const {set,creations}=planRuns(runs,swapped);swapped=null;
  if(creations.some(c=>c.s==='b'))showCombo('爱心炸弹！💖');else if(creations.length)showCombo('一排清！');
  else if(combo>=2)showCombo(WORDS[Math.min(combo-2,WORDS.length-1)]);
  await clearCells(set,creations);await collapse()}}
async function bombSwap(A,B,pa,pb){
 combo=1;const set=new Set();let bombPos=[];
 if(A.t===BOMB)bombPos.push(pa);if(B.t===BOMB)bombPos.push(pb);
 if(A.t===BOMB&&B.t===BOMB){for(let r=0;r<N;r++)for(let c=0;c<N;c++)set.add(r+','+c);showCombo('全屏告白！💞')}
 else{const other=A.t===BOMB?B:A;const tt=other.t;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(ty(r,c)===tt)set.add(r+','+c);showCombo('爱心炸弹！💖')}

 sfx.special();
 await clearCells(set,[]);await collapse();await cascade(null)}

async function trySwap(r1,c1,r2,c2){
 if(busy||!playing)return;if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return;const A=at(r1,c1),B=at(r2,c2);if(!A||!B)return;

 grid[r1][c1]=B;grid[r2][c2]=A;place(A,r2,c2,170);place(B,r1,c1,170);sfx.swap();await sleep(180);

 else if(findRuns().length){moves--;hud();await cascade([[r1,c1],[r2,c2]])}
 else{grid[r1][c1]=A;grid[r2][c2]=B;place(A,r1,c1,170);place(B,r2,c2,170);sfx.bad();await sleep(190);busy=false;armIdle();return}
